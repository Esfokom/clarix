[package]
name = "clarix_pdf_oxide"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["rag"]
ocr = ["dep:image", "dep:ocr-rs"]
rag = ["dep:fastembed", "dep:usearch"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
lopdf = "0.40"
pdf_oxide = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
ocr-rs = { version = "=2.3.2", optional = true }
fastembed = { version = "5.17", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"], optional = true }
usearch = { version = "2.26", optional = true }
