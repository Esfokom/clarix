[package]
name = "clarix_pdf_oxide"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["rag"]
ocr = ["dep:image", "dep:ocr-rs"]
rag = ["dep:fastembed", "dep:usearch"]

[dependencies]
clarix_editing_core = { path = "../clarix_editing_core" }
clarix_pdf_adapter = { path = "../clarix_pdf_adapter" }
clarix_agent_core = { path = "../clarix_agent_core" }
flutter_rust_bridge.workspace = true
lopdf.workspace = true
pdf_oxide.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
ocr-rs = { version = "=2.3.2", optional = true }
fastembed = { version = "5.17", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"], optional = true }
usearch = { version = "2.26", optional = true }
