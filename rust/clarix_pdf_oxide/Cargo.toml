[package]
name = "clarix_pdf_oxide"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ocr = ["dep:image", "dep:ocr-rs"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
pdf_oxide = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
ocr-rs = { version = "=2.3.2", optional = true }
