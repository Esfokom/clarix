[package]
name = "clarix_pdf_oxide"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["rag"]
rag = ["dep:fastembed", "dep:usearch"]

[dependencies]
flutter_rust_bridge.workspace = true
lopdf.workspace = true
pdf_oxide.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
fastembed = { version = "5.17", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"], optional = true }
usearch = { version = "2.26", optional = true }

[dev-dependencies]
tempfile = "3"
rusqlite.workspace = true
